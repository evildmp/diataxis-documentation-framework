<?xml version="1.0" encoding="UTF-8"?>
<svg id="{{ svg_id }}" xmlns="http://www.w3.org/2000/svg" tabindex="0" width="100%" height="100%" viewBox="{{ view_x }} {{ view_y }} {{ view_w }} {{ view_h }}" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="{{ title_id }} {{ desc_id }}" class="diataxis-diagram {{ class }}">
  <title id="{{ title_id }}">{{ title }}</title>
  <desc id="{{ desc_id }}">{{ desc }}</desc>
  <defs>
    <filter id="{{ bg_filter_id }}" x="-2%" y="-10%" width="104%" height="120%">
      <feFlood flood-color="white" result="bg"/>
      <feMerge>
        <feMergeNode in="bg"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      #{{ svg_id }} .axis {
        font-family: "Skia", sans-serif;
        font-weight: 500;
        font-variation-settings: "wght" 1.3, "wdth" 1.0;
        font-size: {{ axis_font_size }}px;
        /*letter-spacing: 2.2px;*/
        text-rendering: geometricPrecision;
      }
      #{{ svg_id }} .type {
        font-family: "Skia", sans-serif;
        font-weight: 230;
        font-variation-settings: "wght" 0.6, "wdth" 1.0;
        font-size: {{ type_font_size }}px;
        text-transform: uppercase;
      }
      #{{ svg_id }} .purpose {
        font-family: "Skia", sans-serif;
        font-weight: 500;
        font-variation-settings: "wght" 1.3, "wdth" 1.0;
        font-size: {{ purpose_font_size }}px;
        fill: #FF9300;
        text-transform: uppercase;
        text-rendering: geometricPrecision;
        letter-spacing: 2.2px;
      }
      #{{ svg_id }} .annotation text {
        font-family: "Skia", sans-serif;
        font-weight: 230;
        font-variation-settings: "wght" 0.6, "wdth" 1.0;
        font-size: {{ annotation_font_size }}px;
        text-rendering: geometricPrecision;
      }
      #{{ svg_id }} .need {
        font-family: "Skia", sans-serif;
        font-size: {{ need_font_size }}px;
        text-rendering: geometricPrecision;
      }
      /* Interactive alt labels: hidden by default, revealed on hover/focus. */
      {% if show_advert %}
      #{{ svg_id }} {
        cursor: pointer;
      }
      #{{ svg_id }} .label-alt {
        opacity: 0;
        transition: opacity 1s ease;
        pointer-events: none;
      }
      #{{ svg_id }} .label-swappable {
        transition: opacity 1s ease;
      }
      #{{ svg_id }}:hover .label-swappable,
      #{{ svg_id }}:focus-within .label-swappable {
        opacity: 0;
      }
      #{{ svg_id }}:hover .label-alt,
      #{{ svg_id }}:focus-within .label-alt {
        opacity: 1;
      }
      #{{ svg_id }} .advert-cue {
        pointer-events: none;
      }
      #{{ svg_id }} .advert-cue .cue-outline {
        opacity: 1;
      }
      #{{ svg_id }} .advert-cue .cue-pulse {
        animation: {{ svg_id }}-cue-pulse 2s ease-in-out infinite;
      }
      @keyframes {{ svg_id }}-cue-pulse {
        0%       { opacity: 1; }
        50%      { opacity: 0; }
        100%     { opacity: 1; }
      }
      #{{ svg_id }}:hover .advert-cue,
      #{{ svg_id }}:focus-within .advert-cue {
        animation: none;
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      {% endif %}
    </style>
  </defs>

  {% if show_x_axis %}
    <line x1="{{ frame_left }}" y1="0" x2="{{ frame_right }}" y2="0" stroke="black" stroke-width="2"/>
  {% endif %}
  {% if show_y_axis %}
    <line x1="0" y1="{{ frame_top }}" x2="0" y2="{{ frame_bottom }}" stroke="black" stroke-width="2"/>
  {% endif %}

  {% if show_axis_label_top %}
    {% if axis_label_top %}
    <text id="axis-label-top" class="axis{% if axis_label_top_alt %} label-swappable{% endif %}" filter="url(#{{ bg_filter_id }})" x="0" y="-{{ axis_y }}" dominant-baseline="middle"
    {% if y_axis_mode == "rotated" %}
      text-anchor="start" transform="rotate(-90 0 -{{ axis_y }})"
    {% else %}
      text-anchor="end" writing-mode="vertical-rl"
    {% endif %}>
    {{ axis_label_top }}
  </text>
    {% endif %}
    {% if axis_label_top_alt %}
    <text id="axis-label-top-alt" class="axis label-alt" filter="url(#{{ bg_filter_id }})" x="0" y="-{{ axis_y }}" dominant-baseline="middle"
    {% if y_axis_mode == "rotated" %}
      text-anchor="start" transform="rotate(-90 0 -{{ axis_y }})"
    {% else %}
      text-anchor="end" writing-mode="vertical-rl"
    {% endif %}>
    {{ axis_label_top_alt }}
  </text>
    {% endif %}
  {% endif %}

  {% if show_axis_label_bottom %}
    {% if axis_label_bottom %}
    <text id="axis-label-bottom" class="axis{% if axis_label_bottom_alt %} label-swappable{% endif %}" filter="url(#{{ bg_filter_id }})" x="0" y="{{ axis_y }}" dominant-baseline="middle"
    {% if y_axis_mode == "rotated" %}
      text-anchor="end" transform="rotate(-90 0 {{ axis_y }})"
    {% else %}
      text-anchor="start" writing-mode="vertical-rl"
    {% endif %}>
    {{ axis_label_bottom }}</text>
    {% endif %}
    {% if axis_label_bottom_alt %}
    <text id="axis-label-bottom-alt" class="axis label-alt" filter="url(#{{ bg_filter_id }})" x="0" y="{{ axis_y }}" dominant-baseline="middle"
    {% if y_axis_mode == "rotated" %}
      text-anchor="end" transform="rotate(-90 0 {{ axis_y }})"
    {% else %}
      text-anchor="start" writing-mode="vertical-rl"
    {% endif %}>
    {{ axis_label_bottom_alt }}</text>
    {% endif %}
  {% endif %}

  {% if show_top_left %}
    {% if top_left %}
    <text id="top-left" class="type{% if top_left_alt %} label-swappable{% endif %}" x="-{{ type_x }}" y="-{{ type_y }}" text-anchor="end" dominant-baseline="middle">{{ top_left }}</text>
    {% endif %}
    {% if top_left_alt %}
    <text id="top-left-alt" class="type label-alt" x="-{{ type_x }}" y="-{{ type_y }}" text-anchor="end" dominant-baseline="middle">{{ top_left_alt }}</text>
    {% endif %}
  {% endif %}
  {% if show_bottom_left_name %}
    {% if bottom_left_name %}
    <text id="bottom-left-name" class="type{% if bottom_left_name_alt %} label-swappable{% endif %}" x="-{{ type_x }}" y="{{ type_y }}" text-anchor="end" dominant-baseline="middle">{{ bottom_left_name }}</text>
    {% endif %}
    {% if bottom_left_name_alt %}
    <text id="bottom-left-name-alt" class="type label-alt" x="-{{ type_x }}" y="{{ type_y }}" text-anchor="end" dominant-baseline="middle">{{ bottom_left_name_alt }}</text>
    {% endif %}
  {% endif %}

  {% if show_purpose_top_left %}
    {% if purpose_top_left %}
    <text id="purpose-top-left" class="purpose{% if purpose_top_left_alt %} label-swappable{% endif %}" x="-{{ type_purpose_x }}" y="-{{ purpose_y }}" text-anchor="end" dominant-baseline="alphabetic">{{ purpose_top_left }}</text>
    {% endif %}
    {% if purpose_top_left_alt %}
    <text id="purpose-top-left-alt" class="purpose label-alt" x="-{{ type_purpose_x }}" y="-{{ purpose_y }}" text-anchor="end" dominant-baseline="alphabetic">{{ purpose_top_left_alt }}</text>
    {% endif %}
  {% endif %}
  {% if show_purpose_bottom_left %}
    {% if purpose_bottom_left %}
    <text id="purpose-bottom-left" class="purpose{% if purpose_bottom_left_alt %} label-swappable{% endif %}" x="-{{ type_purpose_x }}" y="{{ purpose_y }}" text-anchor="end" dominant-baseline="hanging">{{ purpose_bottom_left }}</text>
    {% endif %}
    {% if purpose_bottom_left_alt %}
    <text id="purpose-bottom-left-alt" class="purpose label-alt" x="-{{ type_purpose_x }}" y="{{ purpose_y }}" text-anchor="end" dominant-baseline="hanging">{{ purpose_bottom_left_alt }}</text>
    {% endif %}
  {% endif %}

  {% if show_need_top_left %}
    {% if need_top_left %}
    <text id="need-top-left" class="need{% if need_top_left_alt %} label-swappable{% endif %}" x="-{{ type_x }}" y="-{{ type_y }}" text-anchor="end" dominant-baseline="middle">{{ need_top_left }}</text>
    {% endif %}
    {% if need_top_left_alt %}
    <text id="need-top-left-alt" class="need label-alt" x="-{{ type_x }}" y="-{{ type_y }}" text-anchor="end" dominant-baseline="middle">{{ need_top_left_alt }}</text>
    {% endif %}
  {% endif %}
  {% if show_need_bottom_left_name %}
    {% if need_bottom_left_name %}
    <text id="need-bottom-left-name" class="need{% if need_bottom_left_name_alt %} label-swappable{% endif %}" x="-{{ type_x }}" y="{{ type_y }}" text-anchor="end" dominant-baseline="middle">{{ need_bottom_left_name }}</text>
    {% endif %}
    {% if need_bottom_left_name_alt %}
    <text id="need-bottom-left-name-alt" class="need label-alt" x="-{{ type_x }}" y="{{ type_y }}" text-anchor="end" dominant-baseline="middle">{{ need_bottom_left_name_alt }}</text>
    {% endif %}
  {% endif %}

  {% if show_axis_label_left %}
    {% if axis_label_left %}
    <text id="axis-label-left" class="axis{% if axis_label_left_alt %} label-swappable{% endif %}" filter="url(#{{ bg_filter_id }})" x="-{{ axis_x }}" y="0" text-anchor="end" dominant-baseline="middle">{{ axis_label_left }}</text>
    {% endif %}
    {% if axis_label_left_alt %}
    <text id="axis-label-left-alt" class="axis label-alt" filter="url(#{{ bg_filter_id }})" x="-{{ axis_x }}" y="0" text-anchor="end" dominant-baseline="middle">{{ axis_label_left_alt }}</text>
    {% endif %}
  {% endif %}

  {% if show_top_right_name %}
    {% if top_right_name %}
    <text id="top-right-name" class="type{% if top_right_name_alt %} label-swappable{% endif %}" x="{{ type_x }}" y="-{{ type_y }}" text-anchor="start" dominant-baseline="middle">{{ top_right_name }}</text>
    {% endif %}
    {% if top_right_name_alt %}
    <text id="top-right-name-alt" class="type label-alt" x="{{ type_x }}" y="-{{ type_y }}" text-anchor="start" dominant-baseline="middle">{{ top_right_name_alt }}</text>
    {% endif %}
  {% endif %}
  {% if show_bottom_right_name %}
    {% if bottom_right_name %}
    <text id="bottom-right-name" class="type{% if bottom_right_name_alt %} label-swappable{% endif %}" x="{{ type_x }}" y="{{ type_y }}" text-anchor="start" dominant-baseline="middle">{{ bottom_right_name }}</text>
    {% endif %}
    {% if bottom_right_name_alt %}
    <text id="bottom-right-name-alt" class="type label-alt" x="{{ type_x }}" y="{{ type_y }}" text-anchor="start" dominant-baseline="middle">{{ bottom_right_name_alt }}</text>
    {% endif %}
  {% endif %}

  {% if show_purpose_top_right %}
    {% if purpose_top_right %}
    <text id="purpose-top-right" class="purpose{% if purpose_top_right_alt %} label-swappable{% endif %}" x="{{ type_purpose_x }}" y="-{{ purpose_y }}" text-anchor="start" dominant-baseline="alphabetic">{{ purpose_top_right }}</text>
    {% endif %}
    {% if purpose_top_right_alt %}
    <text id="purpose-top-right-alt" class="purpose label-alt" x="{{ type_purpose_x }}" y="-{{ purpose_y }}" text-anchor="start" dominant-baseline="alphabetic">{{ purpose_top_right_alt }}</text>
    {% endif %}
  {% endif %}
  {% if show_purpose_bottom_right %}
    {% if purpose_bottom_right %}
    <text id="purpose-bottom-right" class="purpose{% if purpose_bottom_right_alt %} label-swappable{% endif %}" x="{{ type_purpose_x }}" y="{{ purpose_y }}" text-anchor="start" dominant-baseline="hanging">{{ purpose_bottom_right }}</text>
    {% endif %}
    {% if purpose_bottom_right_alt %}
    <text id="purpose-bottom-right-alt" class="purpose label-alt" x="{{ type_purpose_x }}" y="{{ purpose_y }}" text-anchor="start" dominant-baseline="hanging">{{ purpose_bottom_right_alt }}</text>
    {% endif %}
  {% endif %}

  {% if show_need_top_right_name %}
    {% if need_top_right_name %}
    <text id="need-top-right-name" class="need{% if need_top_right_name_alt %} label-swappable{% endif %}" x="{{ type_x }}" y="-{{ type_y }}" text-anchor="start" dominant-baseline="middle">{{ need_top_right_name }}</text>
    {% endif %}
    {% if need_top_right_name_alt %}
    <text id="need-top-right-name-alt" class="need label-alt" x="{{ type_x }}" y="-{{ type_y }}" text-anchor="start" dominant-baseline="middle">{{ need_top_right_name_alt }}</text>
    {% endif %}
  {% endif %}
  {% if show_need_bottom_right_name %}
    {% if need_bottom_right_name %}
    <text id="need-bottom-right-name" class="need{% if need_bottom_right_name_alt %} label-swappable{% endif %}" x="{{ type_x }}" y="{{ type_y }}" text-anchor="start" dominant-baseline="middle">{{ need_bottom_right_name }}</text>
    {% endif %}
    {% if need_bottom_right_name_alt %}
    <text id="need-bottom-right-name-alt" class="need label-alt" x="{{ type_x }}" y="{{ type_y }}" text-anchor="start" dominant-baseline="middle">{{ need_bottom_right_name_alt }}</text>
    {% endif %}
  {% endif %}

  {% if show_axis_label_right %}
    {% if axis_label_right %}
    <text id="axis-label-right" class="axis{% if axis_label_right_alt %} label-swappable{% endif %}" filter="url(#{{ bg_filter_id }})" x="{{ axis_x }}" y="0" text-anchor="start" dominant-baseline="middle">{{ axis_label_right }}</text>
    {% endif %}
    {% if axis_label_right_alt %}
    <text id="axis-label-right-alt" class="axis label-alt" filter="url(#{{ bg_filter_id }})" x="{{ axis_x }}" y="0" text-anchor="start" dominant-baseline="middle">{{ axis_label_right_alt }}</text>
    {% endif %}
  {% endif %}

  {% if guides %}
    <line x1="-{{ type_purpose_x }}" y1="{{ frame_top }}" x2="-{{ type_purpose_x }}" y2="{{ frame_bottom }}" stroke="#999" stroke-width="1"/>
    <line x1="{{ type_purpose_x }}" y1="{{ frame_top }}" x2="{{ type_purpose_x }}" y2="{{ frame_bottom }}" stroke="#999" stroke-width="1"/>
    <line x1="{{ frame_left }}" y1="-{{ purpose_y }}" x2="{{ frame_right }}" y2="-{{ purpose_y }}" stroke="#999" stroke-width="1"/>
    <line x1="{{ frame_left }}" y1="{{ purpose_y }}" x2="{{ frame_right }}" y2="{{ purpose_y }}" stroke="#999" stroke-width="1"/>

    <line x1="{{ frame_left }}" y1="{{ frame_top }}" x2="{{ frame_right }}" y2="{{ frame_top }}" stroke="#999" stroke-width="1"/>
    <line x1="{{ frame_right }}" y1="{{ frame_top }}" x2="{{ frame_right }}" y2="{{ frame_bottom }}" stroke="#999" stroke-width="1"/>
    <line x1="{{ frame_right }}" y1="{{ frame_bottom }}" x2="{{ frame_left }}" y2="{{ frame_bottom }}" stroke="#999" stroke-width="1"/>
    <line x1="{{ frame_left }}" y1="{{ frame_bottom }}" x2="{{ frame_left }}" y2="{{ frame_top }}" stroke="#999" stroke-width="1"/>
  {% endif %}

  {% if top_half %}
    <g id="annotation-top-half" class="annotation{% if top_half_alt %} label-swappable{% endif %}" transform="translate({{ annotation_center_x }} {{ annotation_top_y }})">
      {% for line in top_half %}<text x="0" y="{{ (loop.index0 - (loop.length - 1) / 2) * 1.5 }}em" text-anchor="middle" dominant-baseline="middle">{{ line }}</text>{% endfor %}
    </g>
  {% endif %}
  {% if top_half_alt %}
    <g id="annotation-top-half-alt" class="annotation label-alt" transform="translate({{ annotation_center_x }} {{ annotation_top_y }})">
      {% for line in top_half_alt %}<text x="0" y="{{ (loop.index0 - (loop.length - 1) / 2) * 1.5 }}em" text-anchor="middle" dominant-baseline="middle">{{ line }}</text>{% endfor %}
    </g>
  {% endif %}

  {% if bottom_half %}
    <g id="annotation-bottom-half" class="annotation{% if bottom_half_alt %} label-swappable{% endif %}" transform="translate({{ annotation_center_x }} {{ annotation_bottom_y }})">
      {% for line in bottom_half %}<text x="0" y="{{ (loop.index0 - (loop.length - 1) / 2) * 1.5 }}em" text-anchor="middle" dominant-baseline="middle">{{ line }}</text>{% endfor %}
    </g>
  {% endif %}
  {% if bottom_half_alt %}
    <g id="annotation-bottom-half-alt" class="annotation label-alt" transform="translate({{ annotation_center_x }} {{ annotation_bottom_y }})">
      {% for line in bottom_half_alt %}<text x="0" y="{{ (loop.index0 - (loop.length - 1) / 2) * 1.5 }}em" text-anchor="middle" dominant-baseline="middle">{{ line }}</text>{% endfor %}
    </g>
  {% endif %}

  {% if left_half %}
    <g id="annotation-left-half" class="annotation{% if left_half_alt %} label-swappable{% endif %}" transform="translate({{ annotation_left_x }} {{ annotation_center_y }})">
      {% for line in left_half %}<text x="0" y="{{ (loop.index0 - (loop.length - 1) / 2) * 1.5 }}em" text-anchor="middle" dominant-baseline="middle">{{ line }}</text>{% endfor %}
    </g>
  {% endif %}
  {% if left_half_alt %}
    <g id="annotation-left-half-alt" class="annotation label-alt" transform="translate({{ annotation_left_x }} {{ annotation_center_y }})">
      {% for line in left_half_alt %}<text x="0" y="{{ (loop.index0 - (loop.length - 1) / 2) * 1.5 }}em" text-anchor="middle" dominant-baseline="middle">{{ line }}</text>{% endfor %}
    </g>
  {% endif %}

  {% if right_half %}
    <g id="annotation-right-half" class="annotation{% if right_half_alt %} label-swappable{% endif %}" transform="translate({{ annotation_right_x }} {{ annotation_center_y }})">
      {% for line in right_half %}<text x="0" y="{{ (loop.index0 - (loop.length - 1) / 2) * 1.5 }}em" text-anchor="middle" dominant-baseline="middle">{{ line }}</text>{% endfor %}
    </g>
  {% endif %}
  {% if right_half_alt %}
    <g id="annotation-right-half-alt" class="annotation label-alt" transform="translate({{ annotation_right_x }} {{ annotation_center_y }})">
      {% for line in right_half_alt %}<text x="0" y="{{ (loop.index0 - (loop.length - 1) / 2) * 1.5 }}em" text-anchor="middle" dominant-baseline="middle">{{ line }}</text>{% endfor %}
    </g>
  {% endif %}

  {% if show_advert %}
    <g class="advert-cue" transform="translate({{ frame_right - 80 }} {{ frame_bottom - 80 }})">
      <circle class="cue-outline" r="30" fill="none" stroke="#FF9300" stroke-width="3"/>
      <g class="cue-pulse">
        <circle r="30" fill="#FF9300"/>
        <circle cx="-14" cy="0" r="6" fill="white"/>
        <circle cx="0" cy="0" r="6" fill="white"/>
        <circle cx="14" cy="0" r="6" fill="white"/>
      </g>
    </g>
  {% endif %}
</svg>
