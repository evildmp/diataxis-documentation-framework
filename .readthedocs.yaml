# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  commands:
    - pip install --upgrade -r requirements.txt
    - mkdir -p $READTHEDOCS_OUTPUT/html
    - sphinx-build -b html -D language=en source $READTHEDOCS_OUTPUT/html
    - sphinx-build -b html -D language=fr source $READTHEDOCS_OUTPUT/html/fr
    - sphinx-build -b html -D language=pt source $READTHEDOCS_OUTPUT/html/pt

formats:
  - pdf
