version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  commands:
    - pip install --upgrade -r requirements.txt
    - mkdir -p $READTHEDOCS_OUTPUT/html
    - sphinx-build -b dirhtml -D language=en source $READTHEDOCS_OUTPUT/html
    - sphinx-build -b dirhtml -D language=pl source $READTHEDOCS_OUTPUT/html/pl

formats:
  - pdf
  - epub
