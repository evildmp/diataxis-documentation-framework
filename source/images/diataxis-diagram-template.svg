<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="-960 -540 1920 1080" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="label-bg" x="-2%" y="-10%" width="104%" height="120%">
      <feFlood flood-color="white" result="bg"/>
      <feMerge>
        <feMergeNode in="bg"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ============ axes ============ -->
  <line x1="-960" y1="0" x2="960" y2="0" stroke="black" stroke-width="2"/>
  <line x1="0" y1="-540" x2="0" y2="540" stroke="black" stroke-width="2"/>

  <!-- ============ y-axis labels ============ -->

  <text id="action" class="axis" filter="url(#label-bg)" x="0" y="-119" text-anchor="start" dominant-baseline="middle" transform="rotate(-90 0 -119)">Informs action</text>
  <text id="cognition" class="axis" filter="url(#label-bg)" x="0" y="119" text-anchor="end" dominant-baseline="middle" transform="rotate(-90 0 119)">Informs cognition</text>

  <!-- ============ nominal right edge: -154 ============ -->

  <text id="tutorials" class="quadrant" x="-146" y="-240" text-anchor="end" dominant-baseline="middle">Tutorials</text>
  <text id="explanation" class="quadrant" x="-146" y="240" text-anchor="end" dominant-baseline="middle">Explanation</text>

  <text id="learning" class="orientation" x="-154" y="-119" text-anchor="end" dominant-baseline="alphabetic">Learning-oriented</text>
  <text id="understanding" class="orientation" x="-154" y="119" text-anchor="end" dominant-baseline="hanging">Understanding-oriented</text>

  <text id="acquisition" class="axis" filter="url(#label-bg)" x="-154" y="0" text-anchor="end" dominant-baseline="middle">Serves acquisition of skill</text>

  <!-- ============ nominal right edge: 154 ============ -->

  <text id="how-to" class="quadrant" x="146" y="-240" text-anchor="start" dominant-baseline="middle">How-to guides</text>
  <text id="reference" class="quadrant" x="146" y="240" text-anchor="start" dominant-baseline="middle">Reference</text>

  <text id="problem" class="orientation" x="154" y="-119" text-anchor="start" dominant-baseline="alphabetic">Problem-oriented</text>
  <text id="information" class="orientation" x="154  " y="119" text-anchor="start" dominant-baseline="hanging">Information-oriented</text>

  <text id="application" class="axis" filter="url(#label-bg)" x="154" y="0" text-anchor="start" dominant-baseline="middle">Serves application of skill</text>

  <!-- ============ guides ============
  <line x1="-154" y1="-540" x2="-154" y2="540" stroke="#999" stroke-width="1"/>
  <line x1="154" y1="-540" x2="154" y2="540" stroke="#999" stroke-width="1"/>
  <line x1="-960" y1="-119" x2="960" y2="-119" stroke="#999" stroke-width="1"/>
  <line x1="-960" y1="119" x2="960" y2="119" stroke="#999" stroke-width="1"/>
  -->
</svg>
